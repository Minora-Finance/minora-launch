    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Minora?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Minora is a financial platform built around two core products — virtual accounts and stablecoin banking — designed to help you receive, hold, move and manage money in one place."
            }
          },
          {
            "@type": "Question",
            "name": "What are virtual accounts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Virtual accounts are financial accounts that make it easier to receive, hold and manage money through supported financial rails."
            }
          },
          {
            "@type": "Question",
            "name": "What is stablecoin banking?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It's a banking-style experience for holding and managing stablecoins — digital dollars — alongside your virtual accounts."
            }
          },
          {
            "@type": "Question",
            "name": "Which currencies will be supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We're starting with a small set of currencies and stablecoins and will expand support progressively."
            }
          },
          {
            "@type": "Question",
            "name": "Which countries will be supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We're starting with a small number of markets and expanding progressively as we grow."
            }
          },
          {
            "@type": "Question",
            "name": "Can I receive money through a virtual account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — receiving money is a core function of the virtual account. Full details will be shared closer to launch."
            }
          },
          {
            "@type": "Question",
            "name": "Can I hold stablecoins?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — holding supported stablecoins is core to Minora's stablecoin banking product."
            }
          },
          {
            "@type": "Question",
            "name": "Can I convert between currencies?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Conversion between supported currencies and stablecoins will be part of the platform."
            }
          },
          {
            "@type": "Question",
            "name": "When are you launching?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We're finishing development now and will share an exact date with waitlist members first."
            }
          }
